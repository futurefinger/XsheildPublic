<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="heroShield" x1="50" y1="50" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="80%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F59B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <filter id="hyperGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Holographic Nebula -->
  <circle cx="250" cy="250" r="220" fill="url(#coreGlow)" opacity="0.6"/>

  <!-- Orbiting 3D Quantum Rings -->
  <ellipse cx="250" cy="250" rx="230" ry="80" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.8" stroke-dasharray="8 6" transform="rotate(-25 250 250)"/>
  <ellipse cx="250" cy="250" rx="210" ry="70" stroke="rgba(0, 245, 155, 0.35)" stroke-width="1.4" stroke-dasharray="12 4" transform="rotate(35 250 250)"/>
  <ellipse cx="250" cy="250" rx="190" ry="190" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.2" stroke-dasharray="4 8"/>

  <!-- Outer Kinetic Shield Facets -->
  <path d="M250 40 L410 95 V260 C410 370 340 430 250 460 C160 430 90 370 90 260 V95 Z" 
        fill="#050C1B" stroke="url(#heroShield)" stroke-width="6" filter="url(#hyperGlow)"/>

  <!-- Inner Refracted Armor Chamber -->
  <path d="M250 72 L378 116 V252 C378 340 322 392 250 420 C178 392 122 340 122 252 V116 Z" 
        fill="#091833" stroke="rgba(0, 240, 255, 0.5)" stroke-width="2.5"/>

  <!-- Central Tesseract / Hexagonal Sentinel Core -->
  <polygon points="250,140 320,185 320,275 250,320 180,275 180,185" 
           fill="#061226" stroke="#00F0FF" stroke-width="3" filter="url(#hyperGlow)"/>

  <polygon points="250,170 295,200 295,260 250,290 205,260 205,200" 
           fill="rgba(0, 245, 155, 0.2)" stroke="#00F59B" stroke-width="2"/>

  <!-- Radiant Power Emblem -->
  <circle cx="250" cy="230" r="24" fill="#00F0FF" filter="url(#hyperGlow)"/>
  <circle cx="250" cy="230" r="14" fill="#FFFFFF"/>

  <!-- Holographic Floating Node Particles -->
  <circle cx="95" cy="180" r="4" fill="#00F0FF"/>
  <circle cx="405" cy="310" r="4" fill="#00F59B"/>
  <circle cx="250" cy="40" r="5" fill="#FFFFFF"/>
  <circle cx="160" cy="410" r="3" fill="#38BDF8"/>
  <circle cx="340" cy="110" r="3" fill="#A855F7"/>
</svg>
