<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="20" y1="20" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="120" y1="20" x2="120" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Aura Ring -->
  <circle cx="120" cy="120" r="105" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="120" cy="120" r="95" stroke="rgba(0, 245, 155, 0.25)" stroke-width="1"/>

  <!-- Shield Base Contour -->
  <path d="M120 28 L200 56 V126 C200 178 166 206 120 220 C74 206 40 178 40 126 V56 Z" 
        fill="#070E1B" stroke="url(#shieldGrad)" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Inner Defense Bevel -->
  <path d="M120 44 L184 66 V122 C184 164 156 188 120 200 C84 188 56 164 56 122 V66 Z" 
        fill="#0B1A33" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2"/>

  <!-- Central Quantum Core -->
  <polygon points="120,70 148,110 134,152 106,152 92,110" fill="url(#glowGrad)" opacity="0.85"/>
  <circle cx="120" cy="118" r="12" fill="#FFFFFF" filter="url(#neonGlow)"/>

  <!-- Tech Crosshair Accents -->
  <line x1="120" y1="52" x2="120" y2="62" stroke="#00F0FF" stroke-width="2"/>
  <line x1="120" y1="174" x2="120" y2="184" stroke="#00F0FF" stroke-width="2"/>
  <line x1="68" y1="118" x2="78" y2="118" stroke="#00F0FF" stroke-width="2"/>
  <line x1="162" y1="118" x2="172" y2="118" stroke="#00F0FF" stroke-width="2"/>
</svg>
