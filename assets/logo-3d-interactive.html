<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XShield 3D Logo Showcase | Future Finger Technologies</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #0a1128 0%, #030712 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      perspective: 1200px;
      overflow-x: hidden;
    }
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #ffffff 30%, #00f0ff 70%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
    }
    .scene {
      position: relative;
      width: 420px;
      height: 420px;
      max-width: 90vw;
      max-height: 90vw;
      margin: 1rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    .logo-card:active {
      cursor: grabbing;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 25px rgba(0, 240, 255, 0.35));
      transform: translateZ(50px);
    }
    .halo-light {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, rgba(139, 92, 246, 0.15) 50%, transparent 70%);
      filter: blur(20px);
      pointer-events: none;
      transform: translateZ(10px);
    }
    .controls {
      margin-top: 2.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      max-width: 600px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #00f0ff 0%, #0284c7 100%);
      color: #030712;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }
    .btn-primary:hover {
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.7);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #00f0ff;
    }
    .btn-secondary:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: #00f0ff;
      transform: translateY(-2px);
    }
    .hint {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="header">
    <span class="badge">Official Vector Asset</span>
    <h1>XShield 3D Volumetric Logo</h1>
    <p>Multi-faceted titanium defense crest &bull; Future Finger Technologies</p>
  </div>

  <div class="scene" id="scene">
    <div class="halo-light"></div>
    <div class="logo-card" id="logoCard">
      <img src="logo-3d.svg" alt="XShield 3D Logo" class="logo-img" id="logoImg">
    </div>
  </div>

  <p class="hint">🖱️ Move your cursor over the logo to rotate in 3D perspective</p>

  <div class="controls">
    <a href="logo-3d.svg" download="XShield-3D-Logo.svg" class="btn btn-primary">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"></svg>
      Download High-Res SVG (Vector)
    </a>
    <button class="btn btn-secondary" onclick="exportPNG()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></svg>
      Export 2048x2048 Ultra-HD PNG
    </button>
  </div>

  <canvas id="exportCanvas" width="2048" height="2048" style="display:none;"></canvas>

  <script>
    const card = document.getElementById('logoCard');
    const scene = document.getElementById('scene');

    let bounds = scene.getBoundingClientRect();
    window.addEventListener('resize', () => {
      bounds = scene.getBoundingClientRect();
    });

    document.addEventListener('mousemove', (e) => {
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      const centerX = bounds.left + bounds.width / 2;
      const centerY = bounds.top + bounds.height / 2;

      const deltaX = (mouseX - centerX) / (window.innerWidth / 2);
      const deltaY = (mouseY - centerY) / (window.innerHeight / 2);

      const rotateY = deltaX * 28;
      const rotateX = -deltaY * 28;

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    scene.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    function exportPNG() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = 'logo-3d.svg';
      img.onload = () => {
        const canvas = document.getElementById('exportCanvas');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 2048, 2048);
        ctx.drawImage(img, 0, 0, 2048, 2048);
        const link = document.createElement('a');
        link.download = 'XShield-3D-Logo-2048x2048.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
    }
  </script>
</body>
</html>
